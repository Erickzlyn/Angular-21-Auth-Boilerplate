<div class="accounts-wrapper">
  <div class="accounts-header">
    <div>
      <h1 class="accounts-title">Accounts</h1>
      <p class="accounts-sub">All accounts from secure (admin only) API endpoint.</p>
    </div>
    <a routerLink="add" class="accounts-add-btn">+ Create Account</a>
  </div>

  <div class="accounts-table-wrapper">
    <table class="accounts-table">
      <thead>
        <tr>
          <th style="width:30%">NAME</th>
          <th style="width:30%">EMAIL</th>
          <th style="width:30%">ROLE</th>
          <th style="width:10%"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let account of accounts">
          <td class="align-middle">{{account.title}} {{account.firstName}} {{account.lastName}}</td>
          <td class="align-middle">{{account.email}}</td>
          <td class="align-middle">
            <span class="role-badge" [class.role-admin]="account.role === 'Admin'">{{account.role}}</span>
          </td>
          <td style="white-space: nowrap">
            <a routerLink="edit/{{account.id}}" class="btn-edit">Edit</a>
            <button (click)="deleteAccount(account.id)" class="btn-delete" [disabled]="account.isDeleting">
              <span *ngIf="account.isDeleting" class="spinner-border spinner-border-sm"></span>
              <span *ngIf="!account.isDeleting">Delete</span>
            </button>
          </td>
        </tr>
        <tr *ngIf="!accounts">
          <td colspan="4" class="text-center" style="padding: 40px;">
            <span class="spinner-border spinner-border-lg align-center"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  .accounts-wrapper {
    padding: 48px 32px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .accounts-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .accounts-title {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .accounts-sub {
    color: #666;
    font-size: 0.9rem;
    margin: 0;
  }

  .accounts-add-btn {
    padding: 10px 22px;
    background: #C1121F;
    color: #ffffff;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s, transform 0.1s;
  }

  .accounts-add-btn:hover {
    background: #9E101F;
    transform: translateY(-1px);
  }

  .accounts-table-wrapper {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    overflow: hidden;
  }

  .accounts-table {
    width: 100%;
    border-collapse: collapse;
  }

  .accounts-table thead tr {
    background: #222222;
    border-bottom: 2px solid #C1121F;
  }

  .accounts-table thead th {
    color: #C1121F;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 14px 20px;
    text-align: left;
  }

  .accounts-table tbody tr {
    border-bottom: 1px solid #2a2a2a;
    transition: background 0.15s;
  }

  .accounts-table tbody tr:last-child {
    border-bottom: none;
  }

  .accounts-table tbody tr:hover {
    background: #222222;
  }

  .accounts-table tbody td {
    color: #cccccc;
    font-size: 0.9rem;
    padding: 16px 20px;
    vertical-align: middle;
  }

  .role-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 500px;
    font-size: 0.75rem;
    font-weight: 600;
    background: #2a2a2a;
    color: #888;
  }

  .role-badge.role-admin {
    background: rgba(193, 18, 31, 0.15);
    color: #C1121F;
  }

  .btn-edit {
    display: inline-block;
    padding: 6px 14px;
    background: #2a2a2a;
    color: #ffffff;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    margin-right: 6px;
    transition: background 0.2s;
  }

  .btn-edit:hover {
    background: #333;
  }

  .btn-delete {
    display: inline-block;
    padding: 6px 14px;
    background: rgba(193, 18, 31, 0.15);
    color: #C1121F;
    border: 1px solid rgba(193, 18, 31, 0.3);
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-delete:hover {
    background: rgba(193, 18, 31, 0.3);
  }

  .btn-delete:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
