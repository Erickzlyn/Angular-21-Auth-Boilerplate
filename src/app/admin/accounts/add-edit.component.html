<div class="ae-wrapper">
  <div class="ae-card">
    <div class="ae-header">
      <div class="ae-icon">👤</div>
      <h3>{{title}}</h3>
    </div>

    <div *ngIf="loading" class="ae-loading">
      <span class="spinner-border" style="color:#D9A066;"></span>
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Title / First Name / Last Name -->
      <div class="ae-row">
        <div class="ae-field" style="flex: 0 0 110px;">
          <label class="ae-label">TITLE</label>
          <select formControlName="title" class="ae-input" [class.ae-input-error]="submitted && f.title.errors">
            <option value="" style="background:#3A2318"></option>
            <option value="Mr" style="background:#3A2318">Mr</option>
            <option value="Mrs" style="background:#3A2318">Mrs</option>
            <option value="Miss" style="background:#3A2318">Miss</option>
            <option value="Ms" style="background:#3A2318">Ms</option>
          </select>
          <div *ngIf="submitted && f.title.errors" class="ae-error">Title is required</div>
        </div>
        <div class="ae-field" style="flex: 1;">
          <label class="ae-label">FIRST NAME</label>
          <input type="text" formControlName="firstName" class="ae-input" [class.ae-input-error]="submitted && f.firstName.errors" placeholder="John" />
          <div *ngIf="submitted && f.firstName.errors" class="ae-error">First Name is required</div>
        </div>
        <div class="ae-field" style="flex: 1;">
          <label class="ae-label">LAST NAME</label>
          <input type="text" formControlName="lastName" class="ae-input" [class.ae-input-error]="submitted && f.lastName.errors" placeholder="Doe" />
          <div *ngIf="submitted && f.lastName.errors" class="ae-error">Last Name is required</div>
        </div>
      </div>

      <!-- Email / Role -->
      <div class="ae-row">
        <div class="ae-field" style="flex: 2;">
          <label class="ae-label">EMAIL</label>
          <input type="text" formControlName="email" class="ae-input" [class.ae-input-error]="submitted && f.email.errors" placeholder="you@example.com" />
          <div *ngIf="submitted && f.email.errors" class="ae-error">
            <span *ngIf="f.email.errors.required">Email is required</span>
            <span *ngIf="f.email.errors.email">Email must be a valid email address</span>
          </div>
        </div>
        <div class="ae-field" style="flex: 1;">
          <label class="ae-label">ROLE</label>
          <select formControlName="role" class="ae-input" [class.ae-input-error]="submitted && f.role.errors">
            <option value="" style="background:#3A2318"></option>
            <option value="User" style="background:#3A2318">User</option>
            <option value="Admin" style="background:#3A2318">Admin</option>
          </select>
          <div *ngIf="submitted && f.role.errors" class="ae-error">Role is required</div>
        </div>
      </div>

      <!-- Change Password section (edit mode only) -->
      <div *ngIf="id" class="ae-section-divider">
        <span>Change Password</span>
      </div>
      <p *ngIf="id" class="ae-hint">Leave blank to keep the same password</p>

      <!-- Password / Confirm Password -->
      <div class="ae-row">
        <div class="ae-field" style="flex: 1;">
          <label class="ae-label">PASSWORD</label>
          <input type="password" formControlName="password" class="ae-input" [class.ae-input-error]="submitted && f.password.errors" placeholder="••••••••" />
          <div *ngIf="submitted && f.password.errors" class="ae-error">
            <span *ngIf="f.password.errors.required">Password is required</span>
            <span *ngIf="f.password.errors.minlength">Min. 6 characters</span>
          </div>
        </div>
        <div class="ae-field" style="flex: 1;">
          <label class="ae-label">CONFIRM PASSWORD</label>
          <input type="password" formControlName="confirmPassword" class="ae-input" [class.ae-input-error]="submitted && f.confirmPassword.errors" placeholder="••••••••" />
          <div *ngIf="submitted && f.confirmPassword.errors" class="ae-error">
            <span *ngIf="f.confirmPassword.errors.required">Confirm Password is required</span>
            <span *ngIf="f.confirmPassword.errors.mustMatch">Passwords must match</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="ae-actions">
        <button [disabled]="submitting" class="ae-btn-primary">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
          Save
        </button>
        <a routerLink="/admin/accounts" class="ae-btn-link">Cancel</a>
      </div>

    </form>
  </div>
</div>

<style>
  .ae-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    background: linear-gradient(135deg, #2C1A14 0%, #3E2723 50%, #5C3320 100%);
    padding: 40px 24px;
    box-sizing: border-box;
  }

  .ae-card {
    background: linear-gradient(180deg, #3A2318 0%, #2C1A14 100%);
    border: 1px solid rgba(217,160,102,0.20);
    border-top: 3px solid #D9A066;
    border-radius: 20px;
    width: 100%;
    max-width: 680px;
    padding: 48px 40px;
    box-shadow: 0 20px 60px rgba(44,26,20,0.40);
  }

  .ae-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .ae-icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }

  .ae-header h3 {
    color: #FAF3E8;
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .ae-loading {
    display: flex;
    justify-content: center;
    padding: 40px 0;
  }

  .ae-row {
    display: flex;
    gap: 16px;
  }

  .ae-field {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
  }

  .ae-label {
    color: #C8A882;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .ae-input {
    background-color: #4A2E22;
    border: 1px solid rgba(217,160,102,0.20);
    border-radius: 10px;
    color: #FAF3E8;
    padding: 13px 16px;
    font-size: 0.95rem;
    box-sizing: border-box;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    appearance: auto;
  }

  .ae-input::placeholder {
    color: rgba(250,243,232,0.35);
  }

  .ae-input:focus {
    border-color: #D9A066;
    background-color: #4E3328;
    box-shadow: 0 0 0 3px rgba(217,160,102,0.18);
  }

  .ae-input-error {
    border-color: #E57373 !important;
  }

  .ae-error {
    color: #E57373;
    font-size: 0.78rem;
    margin-top: 5px;
    font-weight: 500;
  }

  .ae-section-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0 6px;
    color: #D9A066;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .ae-section-divider::before,
  .ae-section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(217,160,102,0.25);
  }

  .ae-hint {
    color: rgba(200,168,130,0.60);
    font-size: 0.82rem;
    margin: 0 0 16px;
  }

  .ae-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }

  .ae-btn-primary {
    flex: 1;
    padding: 13px;
    background: #D9A066;
    color: #3E2723;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background-color 0.2s, transform 0.1s;
  }

  .ae-btn-primary:hover {
    background: #A26749;
    color: #FAF3E8;
    transform: translateY(-1px);
  }

  .ae-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .ae-btn-link {
    color: #C8A882;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
  }

  .ae-btn-link:hover {
    color: #D9A066;
  }
</style>
