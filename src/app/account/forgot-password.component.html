<div class="fp-wrapper">
  <div class="fp-card">
    <div class="fp-header">
      <div class="fp-icon">🔑</div>
      <h3>Forgot Password</h3>
      <p>Enter your email and we'll send you a reset link.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="fp-field">
        <label class="fp-label">EMAIL</label>
        <input
          type="text"
          formControlName="email"
          class="fp-input"
          [class.fp-input-error]="submitted && f.email.errors"
          placeholder="you@example.com"
        />
        <div *ngIf="submitted && f.email.errors" class="fp-error">
          <span *ngIf="f.email.errors.required">Email is required</span>
          <span *ngIf="f.email.errors.email">Email is invalid</span>
        </div>
      </div>

      <div class="fp-actions">
        <button [disabled]="loading" class="fp-btn-primary">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          Submit
        </button>
        <a routerLink="../login" class="fp-btn-link">Cancel</a>
      </div>
    </form>
  </div>
</div>

<style>
  .fp-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #2C1A14 0%, #3E2723 50%, #5C3320 100%);
    padding: 24px;
    box-sizing: border-box;
  }

  .fp-card {
    background: linear-gradient(180deg, #3A2318 0%, #2C1A14 100%);
    border: 1px solid rgba(217,160,102,0.20);
    border-top: 3px solid #D9A066;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    padding: 48px 36px;
    box-shadow: 0 20px 60px rgba(44,26,20,0.40);
  }

  .fp-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .fp-icon {
    font-size: 2.8rem;
    margin-bottom: 14px;
  }

  .fp-header h3 {
    color: #FAF3E8;
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: -0.02em;
  }

  .fp-header p {
    color: #C8A882;
    font-size: 0.9rem;
    margin: 0;
  }

  .fp-field {
    margin-bottom: 22px;
  }

  .fp-label {
    display: block;
    color: #C8A882;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .fp-input {
    width: 100%;
    background-color: #4A2E22;
    border: 1px solid rgba(217,160,102,0.20);
    border-radius: 10px;
    color: #FAF3E8;
    padding: 13px 16px;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
  }

  .fp-input::placeholder {
    color: rgba(250,243,232,0.35);
  }

  .fp-input:focus {
    border-color: #D9A066;
    background-color: #4E3328;
    box-shadow: 0 0 0 3px rgba(217,160,102,0.18);
  }

  .fp-input-error {
    border-color: #E57373 !important;
  }

  .fp-error {
    color: #E57373;
    font-size: 0.8rem;
    margin-top: 6px;
    font-weight: 500;
  }

  .fp-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }

  .fp-btn-primary {
    flex: 1;
    padding: 13px;
    background: #D9A066;
    color: #3E2723;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background-color 0.2s, transform 0.1s;
  }

  .fp-btn-primary:hover {
    background: #A26749;
    color: #FAF3E8;
    transform: translateY(-1px);
  }

  .fp-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .fp-btn-link {
    color: #C8A882;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
  }

  .fp-btn-link:hover {
    color: #D9A066;
  }
</style>
