<div class="profile-wrapper">
  <div class="profile-card">
    <div class="profile-avatar">
      {{ account?.firstName?.charAt(0) }}{{ account?.lastName?.charAt(0) }}
    </div>
    <h2 class="profile-name">{{ account?.title }} {{ account?.firstName }} {{ account?.lastName }}</h2>
    <p class="profile-email">{{ account?.email }}</p>
    <div class="profile-divider"></div>
    <div class="profile-info" *ngIf="account">
      <div class="profile-info-row">
        <span class="profile-info-label">FULL NAME</span>
        <span class="profile-info-value">{{ account.title }} {{ account.firstName }} {{ account.lastName }}</span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">EMAIL</span>
        <span class="profile-info-value">{{ account.email }}</span>
      </div>
    </div>
    <a routerLink="update" class="profile-update-btn">Edit Profile</a>
  </div>
</div>

<style>
  .profile-wrapper {
    min-height: 100vh;
    background: var(--bg-base);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
  }

  .profile-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-top: 3px solid var(--scarlet-red);
    border-radius: 20px;
    padding: 48px 36px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(21, 21, 21, 0.08);
  }

  .profile-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--scarlet-red);
    color: #ffffff;
    font-size: 1.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .profile-name {
    color: var(--rich-black);
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .profile-email {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 0;
  }

  .profile-divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 28px 0;
  }

  .profile-info {
    text-align: left;
    margin-bottom: 28px;
  }

  .profile-info-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 18px;
  }

  .profile-info-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .profile-info-value {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--rich-black);
  }

  .profile-update-btn {
    display: inline-block;
    padding: 12px 32px;
    background: var(--scarlet-red);
    color: #ffffff;
    border-radius: 500px;
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: background 0.2s, transform 0.1s;
  }

  .profile-update-btn:hover {
    background: #9E101F;
    transform: translateY(-1px);
  }
</style>
