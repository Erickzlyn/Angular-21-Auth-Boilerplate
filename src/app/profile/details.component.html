<div class="profile-wrapper">
  <div class="profile-card">
    <div class="profile-avatar">
      {{ account?.firstName?.charAt(0) }}{{ account?.lastName?.charAt(0) }}
    </div>
    <h2 class="profile-name">{{ account?.title }} {{ account?.firstName }} {{ account?.lastName }}</h2>
    <p class="profile-email">{{ account?.email }}</p>
    <div class="profile-divider"></div>
    <div class="profile-info" *ngIf="account">
      <div class="profile-info-row">
        <span class="profile-info-label">FULL NAME</span>
        <span class="profile-info-value">{{ account.title }} {{ account.firstName }} {{ account.lastName }}</span>
      </div>
      <div class="profile-info-row">
        <span class="profile-info-label">EMAIL</span>
        <span class="profile-info-value">{{ account.email }}</span>
      </div>
    </div>
    <a routerLink="update" class="profile-update-btn">Edit Profile</a>
  </div>
</div>
